name: Serverless invocation context
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  generated-executable:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        go: ['1.24.13', '1.27.3']
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOFLAGS: '-p=1'
      GOMAXPROCS: '1'
      GOMEMLIMIT: 384MiB
      LC_ALL: C
      NEXTGO_CONTEXT_OUTPUT: /tmp/nextgo-invocation-context-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.go }}
      GOCACHE: /tmp/nextgo-invocation-context-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.go }}/go-cache
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Record SDK, nonroot host and exact source inputs
        shell: bash
        env:
          EXPECTED_GO: ${{ matrix.go }}
        run: |
          set -euo pipefail
          [[ $(uname -s) == Linux && $(uname -m) == x86_64 ]]
          [[ $(id -u) != 0 && ! -w / ]]
          out="$NEXTGO_CONTEXT_OUTPUT"
          mkdir -p "$out/dist" "$out/generated" "$out/proof"
          printf 'platform=%s %s\nuid=%s\ncwd_for_executable=/\n' "$(uname -s)" "$(uname -m)" "$(id -u)" > "$out/host.txt"
          go version | tee "$out/sdk.txt"
          [[ $(cat "$out/sdk.txt") == "go version go${EXPECTED_GO} linux/amd64" ]]
          sdk=$(go env GOROOT)
          sha256sum "$sdk/bin/go" "$sdk/pkg/tool/linux_amd64/compile" "$sdk/pkg/tool/linux_amd64/link" "$sdk/lib/wasm/wasm_exec.js" > "$out/sdk-files.sha256"
          app=tests/deployment/fixtures/invocation-context
          for generated in routes/nextgo_gen.go actionrefs/nextgo_gen.go actionrefs/nextgo_gen_js.go actionrefs/nextgo_gen_server.go; do
            [[ ! -e "$app/$generated" && ! -L "$app/$generated" ]]
          done
          [[ -z $(find . -path './.git' -prune -o -type d -name .nextgo -prune -o -type l -print -quit) ]]
          find . -path './.git' -prune -o -type d -name .nextgo -prune -o -type f -print0 | sort -z | xargs -0 sha256sum | sort > "$out/source-before.sha256"
      - name: '1 — Build the actual CLI once'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=20s 9m go build -trimpath -buildvcs=false -o "$NEXTGO_CONTEXT_OUTPUT/dist/nextgo" ./cmd/nextgo 2>&1 | tee "$NEXTGO_CONTEXT_OUTPUT/cli-build.log"
      - name: '2 — Build the actual file-routed fixture once'
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          out="$NEXTGO_CONTEXT_OUTPUT"
          app=tests/deployment/fixtures/invocation-context
          (cd / && timeout --signal=TERM --kill-after=20s 19m "$out/dist/nextgo" build --out "$out/dist/production" "$GITHUB_WORKSPACE/$app") 2>&1 | tee "$out/fixture-build.log"
          : > "$out/generated.sha256"
          for generated in routes/nextgo_gen.go actionrefs/nextgo_gen.go actionrefs/nextgo_gen_js.go actionrefs/nextgo_gen_server.go; do
            file="$app/$generated"
            [[ -f "$file" && ! -L "$file" ]]
            grep -Fq 'Code generated by nextgo' "$file"
            mkdir -p "$out/generated/$(dirname "$generated")"
            cp "$file" "$out/generated/$generated"
            sha256sum "./$file" >> "$out/generated.sha256"
          done
          [[ $(wc -l < "$out/generated.sha256") -eq 4 ]]
          cat "$out/source-before.sha256" "$out/generated.sha256" | sort > "$out/expected-source-after.sha256"
          [[ -z $(find . -path './.git' -prune -o -type d -name .nextgo -prune -o -type l -print -quit) ]]
          find . -path './.git' -prune -o -type d -name .nextgo -prune -o -type f -print0 | sort -z | xargs -0 sha256sum | sort > "$out/source-after-build.sha256"
          cmp "$out/expected-source-after.sha256" "$out/source-after-build.sha256"
          native="$out/dist/production/server"
          [[ -f "$native" && ! -L "$native" && -x "$native" ]]
          [[ $(od -An -v -tx1 -N6 "$native" | tr -d ' \n') == 7f454c460201 ]]
          [[ $(od -An -v -tx1 -j18 -N2 "$native" | tr -d ' \n') == 3e00 ]]
          sha256sum "$out/dist/nextgo" "$native" > "$out/production.sha256"
          wc -c "$out/dist/nextgo" "$native" > "$out/production-bytes.txt"
      - name: '3 — Compile the separately tagged deployment test'
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=20s 14m go test -c -trimpath -buildvcs=false -tags=deployment,invocation_context -o "$NEXTGO_CONTEXT_OUTPUT/dist/invocation.test" ./tests/deployment 2>&1 | tee "$NEXTGO_CONTEXT_OUTPUT/test-build.log"
          sha256sum "$NEXTGO_CONTEXT_OUTPUT/dist/invocation.test" > "$NEXTGO_CONTEXT_OUTPUT/test-executable.sha256"
      - name: '4 — Run and verify actual HTTP and both mock Runtime modes'
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          out="$NEXTGO_CONTEXT_OUTPUT"
          export NEXTGO_TEST_INVOCATION_BINARY="$out/dist/production/server"
          export NEXTGO_TEST_INVOCATION_BINARY_SHA256="$(sha256sum "$NEXTGO_TEST_INVOCATION_BINARY" | cut -d ' ' -f 1)"
          export NEXTGO_TEST_UID="$(id -u)"
          set +e
          (cd / && timeout --signal=TERM --kill-after=20s 120s "$out/dist/invocation.test" -test.run='^TestInvocationIdentityGeneratedExecutable$' -test.v=true -test.timeout=90s) 2>&1 | tee "$out/test.log"
          statuses=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${statuses[0]}" > "$out/test-exit-code.txt"
          [[ ${statuses[1]} == 0 ]]
          bash tests/deployment/fixtures/invocation-context/verify-output.sh "$out/test.log" "$out/proof" "${statuses[0]}"
          sha256sum --check "$out/production.sha256"
          sha256sum --check "$out/test-executable.sha256"
          sha256sum --check "$out/sdk-files.sha256"
          [[ -z $(find . -path './.git' -prune -o -type d -name .nextgo -prune -o -type l -print -quit) ]]
          find . -path './.git' -prune -o -type d -name .nextgo -prune -o -type f -print0 | sort -z | xargs -0 sha256sum | sort > "$out/source-after-test.sha256"
          cmp "$out/expected-source-after.sha256" "$out/source-after-test.sha256"
          printf 'scope=Linux AMD64 nonroot generated-executable functional check only\nnot_claimed=Docker read-only isolation, ARM64, resource bounds, final namespace sampling, AWS, release qualification\n' > "$out/scope.txt"
      - name: Preserve actual proof and generated helper bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invocation-context-go${{ matrix.go }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.NEXTGO_CONTEXT_OUTPUT }}/*.txt
            ${{ env.NEXTGO_CONTEXT_OUTPUT }}/*.log
            ${{ env.NEXTGO_CONTEXT_OUTPUT }}/*.sha256
            ${{ env.NEXTGO_CONTEXT_OUTPUT }}/dist
            ${{ env.NEXTGO_CONTEXT_OUTPUT }}/generated
            ${{ env.NEXTGO_CONTEXT_OUTPUT }}/proof
          if-no-files-found: error
          retention-days: 14
