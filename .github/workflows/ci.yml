          NEXTGO_DEMO_BASE_PATH=/lambda-features NEXTGO_DEMO_ASSET_PREFIX=/lambda-assets ./dist/nextgo export -out ./dist/client-only-static -paths /client-only,/about,/local-fonts,/routing-private,/_public ./examples/demo
          echo "NEXTGO_E2E_SERVER_BINARY=$PWD/dist/client-only/server" >> "$GITHUB_ENV"
          echo "NEXTGO_METADATA_STREAM_SERVER_SHA256=$(sha256sum dist/client-only/server | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          echo "NEXTGO_CLIENT_ONLY_STATIC_ROOT=$PWD/dist/client-only-static" >> "$GITHUB_ENV"
          echo "NEXTGO_LOCAL_FONTS_STATIC_ROOT=$PWD/dist/client-only-static" >> "$GITHUB_ENV"
          echo "NEXTGO_PRIVATE_BINARY=$PWD/dist/client-only/server" >> "$GITHUB_ENV"
          echo "NEXTGO_PRIVATE_SHA256=$(sha256sum dist/client-only/server | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
          echo "NEXTGO_PRIVATE_STATIC_ROOT=$PWD/dist/client-only-static" >> "$GITHUB_ENV"
          NEXTGO_CLIENT_ONLY_STATIC_ROOT="$PWD/dist/client-only-static" node --input-type=module <<'NODE' >> "$GITHUB_ENV"
          import {staticArtifactPin} from './tests/client-only-deployment-fixture.mjs';
          const pin = (await staticArtifactPin(process.env.NEXTGO_CLIENT_ONLY_STATIC_ROOT)).sha256;
          console.log('NEXTGO_CLIENT_ONLY_STATIC_SHA256=' + pin);
          console.log('NEXTGO_LOCAL_FONTS_STATIC_SHA256=' + pin);
          console.log('NEXTGO_PRIVATE_STATIC_SHA256=' + pin);
