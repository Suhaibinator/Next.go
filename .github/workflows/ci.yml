          ENV NEXTGO_TEST_BINARY=/server NEXTGO_TEST_UID=65532 GOMAXPROCS=2
          ENTRYPOINT ["/deployment.test"]
          CMD ["-test.run=^TestPrivateRoutesExecutable$", "-test.v", "-test.timeout=45s"]
          DOCKER
          docker build --network=none -t nextgo-private-routes-local ./dist/client-only
          docker run --rm --read-only --network=none --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=128 --memory=256m nextgo-private-routes-local
      - name: Artifact admission checks
        run: node --test tests/client-only-deployment-fixture.test.mjs
