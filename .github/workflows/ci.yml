          node tests/offline-build-fixture.mjs --source "$GITHUB_WORKSPACE" --out "$NEXTGO_OFFLINE_CI/build"
      - name: Managed offline fixed browser matrix
        timeout-minutes: 30
        shell: bash
        run: |
