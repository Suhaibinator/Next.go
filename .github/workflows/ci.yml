name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-go-${{ matrix.go }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.24.x', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Check generated route helpers
        run: |
          go run ./cmd/nextgo generate --check ./examples/demo
          go run ./cmd/nextgo generate --check ./examples/workspace/site
          go run ./cmd/nextgo generate --check ./examples/content
          go run ./cmd/nextgo generate --check ./examples/metadata-site
          go run ./cmd/nextgo generate --check ./examples/form-validation
          go run ./cmd/nextgo generate --check ./examples/refresh
          go run ./cmd/nextgo generate --check ./examples/zones/marketing
          go run ./cmd/nextgo generate --check ./examples/zones/blog
          go run ./cmd/nextgo generate --check ./examples/zones/tenant
          go run ./cmd/nextgo generate --check ./examples/independent-zones/apps/alpha
          go run ./cmd/nextgo generate --check ./examples/independent-zones/apps/blog
          go run ./cmd/nextgo generate --check ./examples/offline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: go test -race ./...
      - run: go vet ./...
      - name: Go WASM client unit tests
        env:
          GOMAXPROCS: '1'
        run: sh scripts/test-wasm.sh
      - name: Go WASM core and module vet
        run: |
          GOOS=js GOARCH=wasm go vet ./client ./mutation ./offline ./offline/worker ./internal/offlinejson
          GOOS=js GOARCH=wasm go vet -tags=nextgo_module ./client
          GOOS=js GOARCH=wasm go vet -tags=nextgo_devrefresh ./client ./mutation
          GOOS=js GOARCH=wasm go vet -tags='nextgo_module nextgo_devrefresh' ./client
      - run: go run ./cmd/nextgo build -out ./dist/demo ./examples/demo
      - run: go run ./cmd/nextgo build -out ./dist/workspace ./examples/workspace/site
      - name: Additional example production and static builds
        run: |
          go run ./cmd/nextgo build -out ./dist/content ./examples/content
          go run ./cmd/nextgo build -out ./dist/metadata-site ./examples/metadata-site
          go run ./cmd/nextgo build -out ./dist/form-validation ./examples/form-validation
          go run ./cmd/nextgo build -out ./dist/refresh ./examples/refresh
          go run ./cmd/nextgo export -out ./dist/content-static ./examples/content
          NEXTGO_METADATA_BASE_PATH=/metadata-site go run ./cmd/nextgo export -out ./dist/metadata-static ./examples/metadata-site
          NEXTGO_REFRESH_BASE_PATH=/refresh NEXTGO_REFRESH_ASSET_PREFIX=/refresh-assets NEXTGO_REFRESH_PUBLIC_NOTE='Production fixture public note' go run ./cmd/nextgo export -out ./dist/refresh-static ./examples/refresh
      - run: go build -trimpath -o ./dist/nextgo-cache ./cmd/nextgo-cache
      - name: Multi-zone standalone production build
        run: |
          go build -trimpath -o ./dist/nextgo ./cmd/nextgo
          ./dist/nextgo zones build -out ./dist/zones ./examples/zones/zones.json
      - name: Native HTTP, Lambda and durable cache process conformance
        shell: bash
        run: |
          NEXTGO_TEST_BINARY="$PWD/dist/demo/server" \
          NEXTGO_TEST_WORKSPACE_BINARY="$PWD/dist/workspace/server" \
          NEXTGO_TEST_CACHE_BINARY="$PWD/dist/nextgo-cache" \
          go test -race -tags=deployment ./tests/deployment -count=1
      - name: Resources, social images and media through both Lambda modes
        run: NEXTGO_TEST_BINARY="$PWD/dist/demo/server" node --test tests/seven-feature-lambda.test.mjs
      - name: Form validation through native HTTP and both Lambda modes
        run: NEXTGO_FORM_VALIDATION_BINARY="$PWD/dist/form-validation/server" npm run test:form-validation:deployment
      - name: Refresh sample production and static transport contract
        timeout-minutes: 5
        run: NEXTGO_REFRESH_SERVER_BINARY="$PWD/dist/refresh/server" NEXTGO_REFRESH_STATIC_ROOT="$PWD/dist/refresh-static" npm run test:refresh-production
      - name: Multi-zone HTTP, Lambda, authority and publication conformance
        run: NEXTGO_ZONES_BINARY="$PWD/dist/zones/server" NEXTGO_ZONES_CLI="$PWD/dist/nextgo" npm run test:zones:deployment
      - name: Standalone production smoke test
        shell: bash
        run: |
          work=$(mktemp -d)
          cp ./dist/demo/server "$work/server"
          cd "$work"
          ./server -addr 127.0.0.1:4200 >server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4200/api/health; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error --max-time 15 --max-filesize 1048576 \
            --output smoke.html http://127.0.0.1:4200/
          grep -q '<html' smoke.html
          kill -TERM "$server_pid"
          wait "$server_pid"
  browser:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-browser
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install system dependencies with verified task-local APT bounds
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/install-ci-playwright-deps.test.mjs
          node scripts/install-ci-playwright-deps.mjs
      - name: Download repository-pinned Playwright browsers
        timeout-minutes: 30
        run: node node_modules/playwright-core/cli.js install chromium firefox webkit
      - run: npm test
      - run: npm run test:crossbrowser
      - run: npm run test:shared-cache
      - run: npm run test:shared-pages
      - run: npm run test:shared-prerender
      - run: npm run test:static:crossbrowser
      - name: Client resources and lazy-module invalidation
        run: npm run test:resources
      - name: Typed embeds and native media
        run: npm run test:embeds
      - name: Server-rendered social images
        run: npm run test:social-image
      - name: Production artifacts for focused browser fixtures
        run: |
          go run ./cmd/nextgo build -out ./dist/lambda-demo ./examples/demo
          go run ./cmd/nextgo build -out ./dist/metadata-site ./examples/metadata-site
          go run ./cmd/nextgo build -out ./dist/form-validation ./examples/form-validation
          NEXTGO_METADATA_BASE_PATH=/metadata-site go run ./cmd/nextgo export -out ./dist/metadata-static ./examples/metadata-site
          go build -trimpath -o ./dist/nextgo ./cmd/nextgo
          ./dist/nextgo zones build -out ./dist/zones ./examples/zones/zones.json
      - name: Browser hydration and navigation through both local Lambda modes
        run: NEXTGO_E2E_SERVER_BINARY="$PWD/dist/lambda-demo/server" npm run test:lambda:browser
      - name: Managed metadata through native and static deployments
        run: NEXTGO_METADATA_SERVER_BINARY="$PWD/dist/metadata-site/server" NEXTGO_METADATA_STATIC_ROOT="$PWD/dist/metadata-static" npm run test:metadata-files
      - name: Form validation, native choices and lifecycle
        run: NEXTGO_E2E_SERVER_BINARY="$PWD/dist/form-validation/server" npm run test:form-validation
      - name: Multi-zone rendering, navigation and tenant membership
        run: NEXTGO_E2E_SERVER_BINARY="$PWD/dist/zones/server" npm run test:zones
      - name: Multi-zone development rebuild and last-good recovery
        run: NEXTGO_E2E_NEXTGO_BINARY="$PWD/dist/nextgo" npm run test:zones:dev
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-artifacts
          path: |
            test-results/
            test-results-crossbrowser/
            playwright-report/
            .nextgo-test-results/
          include-hidden-files: true
          retention-days: 7
  refresh:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-refresh
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '1'
      GOFLAGS: -p=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install system dependencies with verified task-local APT bounds
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/install-ci-playwright-deps.test.mjs
          node scripts/install-ci-playwright-deps.mjs
      - name: Download repository-pinned Playwright browsers
        timeout-minutes: 15
        run: node node_modules/playwright-core/cli.js install chromium firefox webkit
      - name: Build refresh qualification artifacts
        run: |
          go build -trimpath -o ./dist/nextgo ./cmd/nextgo
          ./dist/nextgo build -out ./dist/refresh ./examples/refresh
          NEXTGO_REFRESH_BASE_PATH=/refresh NEXTGO_REFRESH_ASSET_PREFIX=/refresh-assets NEXTGO_REFRESH_PUBLIC_NOTE='Production fixture public note' ./dist/nextgo export -out ./dist/refresh-static ./examples/refresh
      - name: Refresh production transport contract
        run: NEXTGO_REFRESH_SERVER_BINARY="$PWD/dist/refresh/server" NEXTGO_REFRESH_STATIC_ROOT="$PWD/dist/refresh-static" npm run test:refresh-production
      - name: Opt-in lazy Go state refresh development contract
        timeout-minutes: 60
        run: |
          mkdir -p .nextgo-test-results/refresh-qualification
          PLAYWRIGHT_JSON_OUTPUT_FILE="$PWD/.nextgo-test-results/refresh-qualification/dev.json" NEXTGO_E2E_NEXTGO_BINARY="$PWD/dist/nextgo" npm run test:refresh-dev -- --reporter=list,json
      - name: Refresh sample production and static browsers
        timeout-minutes: 30
        shell: bash
        env:
          NEXTGO_REFRESH_SERVER_BINARY: ${{ github.workspace }}/dist/refresh/server
          NEXTGO_REFRESH_STATIC_ROOT: ${{ github.workspace }}/dist/refresh-static
        run: |
          mkdir -p .nextgo-test-results/refresh-qualification
          for transport in http buffered streaming static; do
            PLAYWRIGHT_JSON_OUTPUT_FILE="$PWD/.nextgo-test-results/refresh-qualification/production-$transport.json" NEXTGO_REFRESH_TRANSPORT="$transport" npm run test:refresh-production:browser -- --reporter=list,json
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refresh-qualification-json
          path: .nextgo-test-results/refresh-qualification/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
  independent-zones:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-independent-zones-${{ matrix.go }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        go: ['1.24.x', 'stable']
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '1'
      GOFLAGS: -p=1
      NEXTGO_INDEPENDENT_ZONES_ARTIFACTS: ${{ github.workspace }}/.nextgo-test-results/independent-zones/operator/artifact-index.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install system dependencies with verified task-local APT bounds
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/install-ci-playwright-deps.test.mjs
          node scripts/install-ci-playwright-deps.mjs
      - name: Download repository-pinned Playwright browsers
        timeout-minutes: 15
        run: node node_modules/playwright-core/cli.js install chromium firefox webkit
      - name: Build independent releases and immutable ingress snapshots
        run: |
          go build -trimpath -o ./dist/nextgo ./cmd/nextgo
          node tests/independent-zones-fixture.mjs build "$PWD/.nextgo-test-results/independent-zones/operator" "$PWD/dist/nextgo"
      - name: Standalone application module tests
        run: |
          GOWORK=off go -C examples/independent-zones/apps/alpha test ./...
          GOWORK=off go -C examples/independent-zones/apps/blog test ./...
      - name: Artifact loader boundaries
        run: node --test tests/independent-zones-deployment-unit.test.mjs
      - name: HTTP and both Lambda modes at ingress and origins
        run: npm run test:zones:independent:deployment
      - name: Independent release browser conformance
        run: |
          PLAYWRIGHT_JSON_OUTPUT_FILE="$PWD/.nextgo-test-results/independent-zones/browser.json" npm run test:zones:independent -- --reporter=list,json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: independent-zones-${{ matrix.go }}
          path: |
            .nextgo-test-results/independent-zones/browser.json
            .nextgo-test-results/independent-zones/operator/artifact-index.json
            .nextgo-test-results/independent-zones/operator/build-provenance.json
            .nextgo-test-results/independent-zones/browser/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
  streaming:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-streaming
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install system dependencies with verified task-local APT bounds
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/install-ci-playwright-deps.test.mjs
          node scripts/install-ci-playwright-deps.mjs
      - name: Download repository-pinned Playwright browsers
        timeout-minutes: 15
        run: node node_modules/playwright-core/cli.js install chromium firefox webkit
      - name: Deterministic initial-stream parser conformance
        run: npm run test:stream-parser
      - name: Stream admission and recoverable navigation
        run: npm run test:stream-admission
      - name: Partial shells and current-request regions
        run: npm run test:partial
      - name: Public shell prefetch and validated resume
        run: npm run test:partial-shell
      - name: Bounded viewport prefetch and lifecycle conformance
        run: npm run test:viewport
      - name: Generated action callers and progressive native forms
        run: npm run test:generated-actions
      - name: Native session cookies and shared typed mutation dispatch
        run: npm run test:cookie-dispatch
      - name: Confirmed mutations and streamed refreshed UI
        run: npm run test:action-view
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: streaming-failure-artifacts
          path: .nextgo-test-results/
          include-hidden-files: true
          retention-days: 7
  offline:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-offline
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --cpus 2 --memory 4g --memory-swap 4g --pids-limit 768 --shm-size 512m
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '1'
      GOFLAGS: -p=1
      GOMEMLIMIT: 384MiB
      GOTELEMETRY: 'off'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Ensure Git checkout metadata
        run: |
          if ! command -v git >/dev/null; then
            apt-get update
            apt-get install --yes --no-install-recommends git
          fi
      - uses: actions/checkout@v4
      - name: Trust the exact checked-out workspace
        shell: bash
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Own offline evidence and cache paths
        shell: bash
        run: |
          set -eu
          offline_root=$(mktemp -d "$RUNNER_TEMP/nextgo-offline-ci.XXXXXX")
          mkdir -p "$GITHUB_WORKSPACE/.nextgo-test-results"
          node scripts/offline-ci-artifacts.mjs init --root "$offline_root" --out "$GITHUB_WORKSPACE/.nextgo-test-results/offline-ci-failure"
          mkdir -p "$offline_root/go-cache" "$offline_root/mod-cache" "$offline_root/report" "$offline_root/browser"
          {
            echo "NEXTGO_OFFLINE_CI=$offline_root"
            echo "GOCACHE=$offline_root/go-cache"
            echo "GOMODCACHE=$offline_root/mod-cache"
            echo "NEXTGO_OFFLINE_ARTIFACTS=$offline_root/build/index.json"
            echo "NEXTGO_E2E_RESULTS=$offline_root/browser"
            echo "PLAYWRIGHT_JSON_OUTPUT_FILE=$offline_root/report/report.json"
          } >> "$GITHUB_ENV"
      - name: Bounded failure collector unit tests
        timeout-minutes: 5
        run: node --test tests/offline-ci-artifacts.test.mjs
      - name: Build one CLI and two offline production artifacts
        timeout-minutes: 25
        shell: bash
        run: |
          set -eu
          go build -trimpath -buildvcs=false -o "$NEXTGO_OFFLINE_CI/nextgo" ./cmd/nextgo
          export NEXTGO_TEST_NEXTGO_BINARY="$NEXTGO_OFFLINE_CI/nextgo"
          export NEXTGO_TEST_NEXTGO_BINARY_SHA256="$(sha256sum "$NEXTGO_TEST_NEXTGO_BINARY" | cut -d ' ' -f 1)"
          node tests/offline-build-fixture.mjs --source "$GITHUB_WORKSPACE" --out "$NEXTGO_OFFLINE_CI/build"
      - name: Managed offline fixed browser matrix
        timeout-minutes: 30
        shell: bash
        run: |
          set -eu
          nextgo_offline_browser_home=$(mktemp -d "$NEXTGO_OFFLINE_CI/browser-home.XXXXXX")
          test -d "$nextgo_offline_browser_home"
          test ! -L "$nextgo_offline_browser_home"
          test "$(realpath -- "$nextgo_offline_browser_home")" = "$nextgo_offline_browser_home"
          test "$(stat -c '%u' -- "$nextgo_offline_browser_home")" = "$(id -u)"
          test "$(stat -c '%a' -- "$nextgo_offline_browser_home")" = 700
          env HOME="$nextgo_offline_browser_home" npm run test:offline -- --reporter=line,json
      - name: Collect bounded offline failure evidence
        if: failure()
        shell: bash
        run: |
          if [ -n "${NEXTGO_OFFLINE_CI:-}" ]; then
            node scripts/offline-ci-artifacts.mjs collect --failure --root "$NEXTGO_OFFLINE_CI"
          else
            echo 'Failure occurred before an owned evidence root was initialized.'
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: offline-failure-artifacts
          path: .nextgo-test-results/offline-ci-failure/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
  link-status:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-link-status
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --cpus 2 --memory 4g --memory-swap 4g --pids-limit 768 --shm-size 512m
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '1'
      GOFLAGS: -p=1
      GOMEMLIMIT: 384MiB
      GOTELEMETRY: 'off'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - name: Ensure Git checkout metadata
        run: |
          if ! command -v git >/dev/null; then
            apt-get update
            apt-get install --yes --no-install-recommends git
          fi
      - uses: actions/checkout@v4
      - name: Trust the exact checked-out workspace
        shell: bash
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Own LinkStatus artifacts and evidence outside checkout
        shell: bash
        run: |
          set -eu
          link_root=$(mktemp -d "$RUNNER_TEMP/nextgo-link-status-ci.XXXXXX")
          export NEXTGO_LINK_STATUS_CI="$link_root"
          node --input-type=module <<'NODE'
          import {realpath} from 'node:fs/promises';
          import {isAbsolute, relative, sep} from 'node:path';
          const root = await realpath(process.env.NEXTGO_LINK_STATUS_CI);
          const checkout = await realpath(process.env.GITHUB_WORKSPACE);
          const rel = relative(checkout, root);
          if (!(isAbsolute(rel) || rel === '..' || rel.startsWith('..' + sep))) throw Error('LinkStatus output must be outside checkout');
          NODE
          mkdir -p "$link_root/go-cache" "$link_root/mod-cache" "$link_root/browser"
          {
            echo "NEXTGO_LINK_STATUS_CI=$link_root"
            echo "GOCACHE=$link_root/go-cache"
            echo "GOMODCACHE=$link_root/mod-cache"
            echo "NEXTGO_E2E_SERVER_BINARY=$link_root/demo/server"
            echo "NEXTGO_LINK_STATUS_PROCESS_PROOF=$link_root/process-proof.json"
            echo "NEXTGO_E2E_RESULTS=$link_root/browser"
            echo "PLAYWRIGHT_JSON_OUTPUT_FILE=$link_root/report.json"
          } >> "$GITHUB_ENV"
      - name: Build one CLI and the native demo artifact
        timeout-minutes: 25
        shell: bash
        run: |
          set -eu
          go build -trimpath -buildvcs=false -o "$NEXTGO_LINK_STATUS_CI/nextgo" ./cmd/nextgo
          "$NEXTGO_LINK_STATUS_CI/nextgo" build -out "$NEXTGO_LINK_STATUS_CI/demo" ./examples/demo
          chmod 0500 "$NEXTGO_LINK_STATUS_CI/nextgo" "$NEXTGO_E2E_SERVER_BINARY"
          echo "NEXTGO_LINK_STATUS_SERVER_SHA256=$(sha256sum "$NEXTGO_E2E_SERVER_BINARY" | cut -d ' ' -f 1)" >> "$GITHUB_ENV"
      - name: LinkStatus fixed browser matrix and native cleanup proof
        timeout-minutes: 30
        shell: bash
        run: |
          set -eu
          nextgo_link_status_browser_home=$(mktemp -d "$NEXTGO_LINK_STATUS_CI/browser-home.XXXXXX")
          test -d "$nextgo_link_status_browser_home"
          test ! -L "$nextgo_link_status_browser_home"
          test "$(realpath -- "$nextgo_link_status_browser_home")" = "$nextgo_link_status_browser_home"
          test "$(stat -c '%u' -- "$nextgo_link_status_browser_home")" = "$(id -u)"
          test "$(stat -c '%a' -- "$nextgo_link_status_browser_home")" = 700
          env HOME="$nextgo_link_status_browser_home" node scripts/test-browser.mjs --config=tests/link-status.config.mjs --reporter=line,json
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import {constants} from 'node:fs';
          import {join} from 'node:path';
          const root = process.env.NEXTGO_LINK_STATUS_CI;
          async function readJSON(name, cap) {
            const path = join(root, name), before = await fs.lstat(path);
            if (!before.isFile() || before.isSymbolicLink() || before.size > cap) throw Error('Unsafe or oversized LinkStatus proof');
            const file = await fs.open(path, constants.O_RDONLY | constants.O_NOFOLLOW | constants.O_NONBLOCK);
            try {
              const opened = await file.stat();
              if (!opened.isFile() || opened.dev !== before.dev || opened.ino !== before.ino || opened.size !== before.size) throw Error('LinkStatus proof changed before read');
              const bytes = Buffer.alloc(before.size + 1);
              let count = 0;
              while (count < bytes.length) {
                const read = await file.read(bytes, count, bytes.length - count, null);
                if (!read.bytesRead) break;
                count += read.bytesRead;
              }
              const after = await file.stat();
              if (count !== before.size || after.size !== before.size || after.mtimeMs !== before.mtimeMs) throw Error('LinkStatus proof changed during read');
              return JSON.parse(bytes.subarray(0, count).toString('utf8'));
            } finally { await file.close(); }
          }
          const report = await readJSON('report.json', 16 * 1024 * 1024);
          if (report.stats?.expected !== 60 || report.stats.unexpected !== 0 || report.stats.flaky !== 0 || report.stats.skipped !== 0 || !Array.isArray(report.errors) || report.errors.length) throw Error('LinkStatus matrix must complete exactly 60 expected tests without skips, flakes or errors');
          const counts = new Map(['chromium', 'firefox', 'webkit', 'webkit-touch'].map(name => [`link-status-${name}`, 0]));
          const pending = (report.suites || []).map(suite => [suite, 0]);
          let visited = 0;
          while (pending.length) {
            const [suite, depth] = pending.pop();
            if (++visited > 4096 || depth > 16) throw Error('LinkStatus report traversal limit');
            for (const spec of suite.specs || []) for (const test of spec.tests || []) {
              if (++visited > 4096) throw Error('LinkStatus report traversal limit');
              if (!counts.has(test.projectName) || test.expectedStatus !== 'passed' || test.status !== 'expected' || test.results?.length !== 1 || test.results[0].status !== 'passed' || test.results[0].retry !== 0) throw Error('LinkStatus requires one passing attempt for every declared test');
              counts.set(test.projectName, counts.get(test.projectName) + 1);
            }
            for (const child of suite.suites || []) pending.push([child, depth + 1]);
          }
          if ([...counts.values()].some(count => count !== 15)) throw Error('LinkStatus requires 15 passing tests in each of four projects');
          const proof = await readJSON('process-proof.json', 1024 * 1024);
          if (proof.binary !== process.env.NEXTGO_E2E_SERVER_BINARY || proof.sha256 !== process.env.NEXTGO_LINK_STATUS_SERVER_SHA256 || !Number.isSafeInteger(proof.pid) || proof.pid < 1 || proof.spawned !== true || proof.closed !== true || proof.joined !== true || proof.cwdRemoved !== true || proof.code !== 0 || proof.signal !== null || proof.killSent !== false || proof.failure !== '') throw Error('LinkStatus native process cleanup or artifact proof failed');
          console.log('LinkStatus: 60 expected passes; native artifact and graceful cleanup verified.');
          NODE
      - name: Collect bounded LinkStatus failure metadata
        if: failure()
        shell: bash
        run: |
          if [ -z "${NEXTGO_LINK_STATUS_CI:-}" ]; then
            echo 'Failure occurred before an owned evidence root was initialized.'
            exit 0
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          import {constants} from 'node:fs';
          import {basename, isAbsolute, join, relative, resolve, sep} from 'node:path';
          const root = await fs.realpath(process.env.NEXTGO_LINK_STATUS_CI);
          const rel = relative(await fs.realpath(process.env.GITHUB_WORKSPACE), root);
          const info = await fs.lstat(root);
          if (!(isAbsolute(rel) || rel === '..' || rel.startsWith('..' + sep)) ||
              !basename(root).startsWith('nextgo-link-status-ci.') || !info.isDirectory() ||
              info.isSymbolicLink() || (info.mode & 0o077) || info.uid !== process.getuid()) throw Error('Refused a foreign evidence root');
          const out = join(root, 'failure');
          await fs.mkdir(out, {mode: 0o700});
          const report = {version: 1, purpose: 'link-status-ci-failure', copied: [], omitted: [],
            payloadLimit: 25 * 1024 * 1024, manifestLimit: 65536};
          let total = 0, testReport;
          async function copy(path, name, cap) {
            let file;
            try {
              const before = await fs.lstat(path);
              if (!before.isFile() || before.isSymbolicLink()) throw Error('nonregular-or-symlink');
              if (before.size > cap) throw Error('file-byte-limit');
              file = await fs.open(path, constants.O_RDONLY | constants.O_NOFOLLOW | constants.O_NONBLOCK);
              const opened = await file.stat();
              if (!opened.isFile() || opened.dev !== before.dev || opened.ino !== before.ino || opened.size !== before.size) throw Error('changed-before-read');
              const bytes = Buffer.alloc(before.size + 1);
              let count = 0;
              while (count < bytes.length) {
                const read = await file.read(bytes, count, bytes.length - count, null);
                if (!read.bytesRead) break;
                count += read.bytesRead;
              }
              const after = await file.stat();
              if (count !== before.size || after.size !== before.size || after.mtimeMs !== before.mtimeMs) throw Error('changed-during-read');
              if (total + count > report.payloadLimit) throw Error('total-byte-limit');
              await fs.writeFile(join(out, name), bytes.subarray(0, count), {flag: 'wx', mode: 0o600});
              total += count; report.copied.push({path: name, bytes: count});
              return bytes.subarray(0, count);
            } catch (error) {
              report.omitted.push({path: name, reason: String(error.code || error.message).slice(0,128)});
            } finally { await file?.close(); }
          }
          testReport = await copy(join(root, 'report.json'), 'report.json', 16 * 1024 * 1024);
          await copy(join(root, 'process-proof.json'), 'process-proof.json', 1024 * 1024);
          try {
            if (!testReport) throw Error('bounded-report-unavailable');
            const parsed = JSON.parse(testReport.toString('utf8')), failures = [];
            const pending = (parsed.suites || []).map(suite => [suite, 0]);
            let visited = 0;
            while (pending.length) {
              const [suite, depth] = pending.pop();
              if (++visited > 4096 || depth > 16) throw Error('report-traversal-limit');
              for (const spec of suite.specs || []) for (const test of spec.tests || []) for (const result of test.results || []) {
                if (++visited > 4096) throw Error('report-traversal-limit');
                if (test.status === 'unexpected' && ['failed', 'timedOut'].includes(result.status)) {
                  const time = Date.parse(result.startTime);
                  if (!Number.isSafeInteger(time)) throw Error('invalid-failure-time');
                  failures.push({time, result});
                }
              }
              for (const child of suite.suites || []) pending.push([child, depth + 1]);
            }
            failures.sort((a,b) => a.time - b.time);
            const attachments = failures[0]?.result.attachments || [];
            const traces = attachments.filter(item => item.name === 'trace' && item.contentType === 'application/zip');
            if (traces.length !== 1) throw Error('first-failure-trace-unavailable-or-ambiguous');
            const path = traces[0].path, browser = join(root, 'browser');
            if (typeof path !== 'string' || !isAbsolute(path) || path.length > 2048 || resolve(path) !== path) throw Error('invalid-trace-path');
            const rel = relative(browser, path), parts = rel.split(sep);
            if (isAbsolute(rel) || parts.includes('..') || parts.length < 2 || parts.length > 6 || parts.at(-1) !== 'trace.zip') throw Error('trace-outside-owned-results');
            let parent = browser;
            for (const part of ['', ...parts.slice(0,-1)]) {
              if (part) parent = join(parent, part);
              const info = await fs.lstat(parent);
              if (!info.isDirectory() || info.isSymbolicLink()) throw Error('unsafe-trace-parent');
            }
            await copy(path, 'first-failure-trace.zip', 8 * 1024 * 1024);
          } catch (error) {
            report.omitted.push({path: 'first-failure-trace.zip', reason: String(error.code || error.message).slice(0,128)});
          }
          report.payloadBytes = total;
          const manifest = JSON.stringify(report, null, 2) + '\n';
          if (Buffer.byteLength(manifest) > report.manifestLimit) throw Error('Manifest byte limit');
          await fs.writeFile(join(out, 'collection.json'), manifest, {flag: 'wx', mode: 0o600});
          NODE
      - uses: actions/upload-artifact@v4
        if: failure() && env.NEXTGO_LINK_STATUS_CI != ''
        with:
          name: link-status-failure-metadata
          path: ${{ env.NEXTGO_LINK_STATUS_CI }}/failure/
          if-no-files-found: warn
          retention-days: 7
  container:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-container
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nextgo-demo .
      - name: Container smoke test
        shell: bash
        run: |
          docker run --detach --name nextgo-demo --read-only --cap-drop ALL --security-opt no-new-privileges -p 127.0.0.1:4201:3000 nextgo-demo
          trap 'docker logs nextgo-demo; docker rm --force nextgo-demo' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4201/api/health; then break; fi
            sleep 1
          done
          smoke_html=$(mktemp)
          curl --fail --silent --show-error --max-time 15 --max-filesize 1048576 \
            --output "$smoke_html" http://127.0.0.1:4201/
          grep -q '<html' "$smoke_html"
      - name: Isolated executable deployment conformance
        run: ./scripts/test-deployment-container.sh
      - name: Shared-cache Linux browser conformance
        run: sh ./scripts/test-shared-cache-container.sh
      - name: Shared-page Linux browser conformance
        run: sh ./scripts/test-shared-pages-container.sh
      - name: Shared-prerender Linux browser conformance
        run: sh ./scripts/test-shared-prerender-container.sh
      - name: Initial-stream parser Linux conformance
        run: sh ./scripts/test-stream-parser-container.sh
      - name: Stream admission Linux conformance
        run: sh ./scripts/test-stream-admission-container.sh
      - name: Partial prerender Linux browser conformance
        run: sh ./scripts/test-partial-container.sh
      - name: Public shell prefetch Linux browser conformance
        run: sh ./scripts/test-partial-shell-container.sh
      - name: Viewport prefetch Linux browser conformance
        run: sh ./scripts/test-viewport-container.sh
      - name: Generated action Linux browser conformance
        run: sh ./scripts/test-generated-actions-container.sh
      - name: Native session cookies and typed dispatch Linux conformance
        run: sh ./scripts/test-cookie-dispatch-container.sh
      - name: Combined action and refreshed view Linux conformance
        run: sh ./scripts/test-action-view-container.sh
      - name: Official OTLP collector integration
        run: ./scripts/test-collector-container.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: container-failure-artifacts
          path: .nextgo-test-results/
          include-hidden-files: true
          retention-days: 7
