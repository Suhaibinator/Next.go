          assert.equal(report.stats.expected, 76);
          for (const field of ['unexpected', 'flaky', 'skipped']) assert.equal(report.stats[field], 0, field);
          assert.equal(report.config.projects.length, 16);
          assert.deepEqual(report.errors, []);
