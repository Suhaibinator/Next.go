name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  widgets:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        go: ['1.24.x', 'stable']
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOFLAGS: -p=2
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify the pinned licensed library snapshots
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {join} from 'node:path';
          const manifest = JSON.parse(await readFile('tests/widgets-vendor.json', 'utf8'));
          for (const [name, pin] of Object.entries(manifest.files)) {
            const data = await readFile(join(manifest.root, name));
            assert.equal(data.length, pin.bytes);
            assert.equal(createHash('sha256').update(data).digest('hex'), pin.sha256);
            assert.equal('sha384-' + createHash('sha384').update(data).digest('base64'), pin.sha384);
          }
          NODE
      - name: Build and pin standalone and static widget artifacts
        run: |
          mkdir -p .nextgo-test-results/widgets
          go build -trimpath -o ./dist/nextgo ./cmd/nextgo
          ./dist/nextgo generate --check ./examples/widgets
          ./dist/nextgo build -out ./dist/widgets ./examples/widgets
          NEXTGO_METADATA_BASE_PATH=/lambda-features NEXTGO_METADATA_ASSET_PREFIX=/lambda-assets ./dist/nextgo export -out ./dist/widgets-static ./examples/widgets
          go test -c -tags=deployment -o ./dist/widgets/deployment.test ./tests/deployment
          echo "NEXTGO_WIDGET_BINARY=$PWD/dist/widgets/server" >> "$GITHUB_ENV"
          echo "NEXTGO_WIDGET_SHA256=$(sha256sum dist/widgets/server | cut -d ' ' -f1)" >> "$GITHUB_ENV"
          echo "NEXTGO_WIDGET_STATIC_ROOT=$PWD/dist/widgets-static" >> "$GITHUB_ENV"
          NEXTGO_WIDGET_STATIC_ROOT="$PWD/dist/widgets-static" node --input-type=module <<'NODE' >> "$GITHUB_ENV"
          import {staticArtifactPin} from './tests/client-only-deployment-fixture.mjs';
          console.log('NEXTGO_WIDGET_STATIC_SHA256=' + (await staticArtifactPin(process.env.NEXTGO_WIDGET_STATIC_ROOT)).sha256);
          NODE
      - name: Browser library lifecycle over HTTP, both Lambda modes and static files
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/.nextgo-test-results/widgets/browser.json
        run: npx playwright test -c tests/widgets.config.mjs --reporter=list,json
      - name: Require the full browser matrix
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          const report = JSON.parse(await readFile('.nextgo-test-results/widgets/browser.json', 'utf8'));
          assert.equal(report.stats.expected, 208);
          for (const field of ['unexpected', 'flaky', 'skipped']) assert.equal(report.stats[field], 0, field);
          assert.equal(report.config.projects.length, 16);
          assert.deepEqual(report.errors, []);
          NODE
      - name: Native and restricted-container widget executable conformance
        run: |
          NEXTGO_TEST_WIDGET_BINARY="$NEXTGO_WIDGET_BINARY" NEXTGO_TEST_WIDGET_SHA256="$NEXTGO_WIDGET_SHA256" ./dist/widgets/deployment.test '-test.run=^TestWidgetsExecutable$' -test.v -test.timeout=120s > .nextgo-test-results/widgets/host.log 2>&1
          cat > ./dist/widgets/Dockerfile <<'DOCKER'
          FROM scratch
          COPY --chmod=0555 server /server
          COPY --chmod=0555 deployment.test /deployment.test
          USER 65532:65532
          ENV NEXTGO_TEST_WIDGET_BINARY=/server NEXTGO_TEST_UID=65532 GOMAXPROCS=2
          ENTRYPOINT ["/deployment.test"]
          CMD ["-test.run=^TestWidgetsExecutable$", "-test.v", "-test.timeout=120s"]
          DOCKER
          docker build --network=none -t nextgo-widgets-local ./dist/widgets
          docker run --rm --read-only --network=none --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=128 --memory=256m -e NEXTGO_TEST_WIDGET_SHA256="$NEXTGO_WIDGET_SHA256" nextgo-widgets-local > .nextgo-test-results/widgets/container.log 2>&1
          python3 - <<'PY'
          import pathlib, re
          for name in ('host', 'container'):
              log = pathlib.Path('.nextgo-test-results/widgets/' + name + '.log').read_text()
              passed = re.findall(r'^\s*--- PASS: (\S+)', log, re.M)
              leaves = [p for p in passed if not any(q.startswith(p + '/') for q in passed)]
              assert len(leaves) == 84, (name, len(leaves))
              assert not re.search(r'--- (FAIL|SKIP):', log), name
              assert log.rstrip().endswith('PASS'), name
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: widgets-${{ matrix.go }}
          path: .nextgo-test-results/widgets/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOFLAGS: -p=2
      CGO_ENABLED: '0'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install the isolated pinned Next.js reference
        run: npm --prefix tests/performance/nextjs ci --ignore-scripts --no-audit --no-fund
      - name: Build the production Next.js reference
        run: |
          mkdir -p .nextgo-test-results/framework-comparison/nextjs-standalone
          npm --prefix tests/performance/nextjs run build > .nextgo-test-results/framework-comparison/build-nextjs.log 2>&1
          cp -a tests/performance/nextjs/.next/standalone/. .nextgo-test-results/framework-comparison/nextjs-standalone/
          cp -a tests/performance/nextjs/.next/static .nextgo-test-results/framework-comparison/nextjs-standalone/.next/static
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: false
      - name: Build the Go compatibility reference
        run: |
          go run ./cmd/nextgo generate --check ./examples/comparison
          go vet ./examples/comparison/...
          GOOS=js GOARCH=wasm go vet ./examples/comparison/components/counter
          go run ./cmd/nextgo build -out .nextgo-test-results/framework-comparison/go1.24 ./examples/comparison > .nextgo-test-results/framework-comparison/build-go1.24.log 2>&1
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: false
      - name: Build the Go production reference
        run: |
          go run ./cmd/nextgo generate --check ./examples/comparison
          go vet ./examples/comparison/...
          GOOS=js GOARCH=wasm go vet ./examples/comparison/components/counter
          go run ./cmd/nextgo build -out .nextgo-test-results/framework-comparison/go1.27 ./examples/comparison > .nextgo-test-results/framework-comparison/build-go1.27.log 2>&1
      - name: Check matched behavior and record local performance
        run: |
          node tests/performance/compare.mjs --go27="$PWD/.nextgo-test-results/framework-comparison/go1.27/server" --go24="$PWD/.nextgo-test-results/framework-comparison/go1.24/server" --next="$PWD/.nextgo-test-results/framework-comparison/nextjs-standalone" --out="$PWD/.nextgo-test-results/framework-comparison/observations" --samples=12 --requests=1000
      - name: Independently verify closed server listeners
        run: |
          python3 - <<'PY'
          import pathlib, re, socket
          root = pathlib.Path('.nextgo-test-results/framework-comparison/observations')
          ports = set()
          for name in ('go1.27', 'go1.24', 'nextjs16.4.5'):
              found = set(re.findall(r'127\.0\.0\.1:(\d+)', (root / (name + '.log')).read_text()))
              assert len(found) == 1, (name, found)
              ports.update(found)
          assert len(ports) == 3
          for port in ports:
              try:
                  connection = socket.create_connection(('127.0.0.1', int(port)), timeout=.3)
              except ConnectionRefusedError:
                  continue
              connection.close()
              raise AssertionError('server listener remains: ' + port)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-framework-comparison
          path: .nextgo-test-results/framework-comparison/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
  aws-rie:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.24.x', 'stable']
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOFLAGS: -p=2
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # The independently built emulator requires Go >= 1.26.6.
          go-version: '1.27.3'
          cache: false
      - name: Build the checksum-verified official AWS emulator
        run: |
          mkdir -p dist/aws-rie .nextgo-test-results/aws-rie
          GOBIN="$PWD/dist/aws-rie" go install github.com/aws/aws-lambda-runtime-interface-emulator/cmd/aws-lambda-rie@v0.0.0-20261030183630-d71cae7ddcf3
          go version -m dist/aws-rie/aws-lambda-rie > .nextgo-test-results/aws-rie/emulator-build.txt
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Build and pin the standalone application and harness
        run: |
          go version > .nextgo-test-results/aws-rie/application-sdk.txt
          go run ./cmd/nextgo build -out ./dist/aws-rie/demo ./examples/demo
          cp dist/aws-rie/demo/server dist/aws-rie/server
          go test -c -tags=deployment -o ./dist/aws-rie/deployment.test ./tests/deployment
          sha256sum dist/aws-rie/server dist/aws-rie/aws-lambda-rie dist/aws-rie/deployment.test > .nextgo-test-results/aws-rie/executables.sha256
          echo "NEXTGO_RIE_SHA256=$(sha256sum dist/aws-rie/aws-lambda-rie | cut -d ' ' -f1)" >> "$GITHUB_ENV"
          echo "NEXTGO_TEST_BINARY_SHA256=$(sha256sum dist/aws-rie/server | cut -d ' ' -f1)" >> "$GITHUB_ENV"
      - name: Official emulator executable contract on the host
        run: |
          NEXTGO_RIE_BINARY="$PWD/dist/aws-rie/aws-lambda-rie" NEXTGO_TEST_BINARY="$PWD/dist/aws-rie/server" ./dist/aws-rie/deployment.test '-test.run=^TestAWSRIE' -test.v -test.timeout=120s > .nextgo-test-results/aws-rie/host.log 2>&1
      - name: Official emulator in a restricted Linux container
        run: |
          cat > dist/aws-rie/Dockerfile <<'DOCKER'
          FROM scratch
          COPY --chmod=0555 server /server
          COPY --chmod=0555 aws-lambda-rie /rie
          COPY --chmod=0555 deployment.test /deployment.test
          USER 65532:65532
          ENV NEXTGO_RIE_BINARY=/rie NEXTGO_TEST_BINARY=/server NEXTGO_TEST_UID=65532 GOMAXPROCS=2
          ENTRYPOINT ["/deployment.test"]
          CMD ["-test.run=^TestAWSRIE", "-test.v", "-test.timeout=120s"]
          DOCKER
          docker build --network=none -t nextgo-aws-rie-local ./dist/aws-rie
          docker run --rm --read-only --network=none --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=128 --memory=256m --tmpfs /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777 -e NEXTGO_RIE_SHA256 -e NEXTGO_TEST_BINARY_SHA256 nextgo-aws-rie-local > .nextgo-test-results/aws-rie/container.log 2>&1
      - name: Require both complete local matrices
        run: |
          python3 - <<'PY'
          import pathlib, re
          for name in ('host', 'container'):
              log = pathlib.Path(f'.nextgo-test-results/aws-rie/{name}.log').read_text()
              passed = re.findall(r'^\s*--- PASS: (TestAWSRIE\S+)', log, re.M)
              cases = [p for p in passed if p.startswith('TestAWSRIECookieSessionExecutable/') or p.rsplit('/', 1)[-1] in ('cold-and-warm-health', 'native-SSR', 'navigation-envelope', 'HEAD', 'compressed-runtime-binary', 'warm-generated-mutation', 'unsupported-event-error-and-recovery')]
              assert len(cases) == len(set(cases)) == 32, (name, len(cases))
              assert not re.search(r'--- (FAIL|SKIP):', log), name
              assert log.rstrip().endswith('PASS'), name
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aws-rie-${{ matrix.go }}
          path: .nextgo-test-results/aws-rie/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
  advisories:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [native, wasm-core, wasm-module]
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOFLAGS: -p=2
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Match the production Docker SDK; 1.24 remains compatibility-only.
          go-version: '1.27.3'
          cache: false
      - name: Install the checksum-verified advisory checker
        run: |
          mkdir -p .nextgo-test-results/advisories/tools
          GOBIN="$PWD/.nextgo-test-results/advisories/tools" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go version > .nextgo-test-results/advisories/sdk.txt
          go version -m .nextgo-test-results/advisories/tools/govulncheck > .nextgo-test-results/advisories/checker.txt
      - name: Check the production SDK against the live official database
        shell: bash
        run: |
          checker="$PWD/.nextgo-test-results/advisories/tools/govulncheck"
          case '${{ matrix.target }}' in
            native)
              "$checker" -json ./... > .nextgo-test-results/advisories/result.json
              ;;
            wasm-core)
              GOOS=js GOARCH=wasm "$checker" -json ./client ./mutation ./offline ./offline/worker ./internal/navigation ./internal/routing ./ui ./examples/demo/components/... ./examples/widgets/components/... > .nextgo-test-results/advisories/result.json
              ;;
            wasm-module)
              GOOS=js GOARCH=wasm GOFLAGS='-p=2 -tags=nextgo_module' "$checker" -json ./client ./mutation ./offline ./offline/worker ./internal/navigation ./internal/routing ./ui ./examples/demo/components/... ./examples/widgets/components/... > .nextgo-test-results/advisories/result.json
              ;;
          esac
          # JSON mode exits zero even with findings. The pinned checker's
          # converter returns nonzero for reachable findings and gates this job.
          "$checker" -mode=convert < .nextgo-test-results/advisories/result.json > .nextgo-test-results/advisories/result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: advisories-${{ matrix.target }}
          path: |
            .nextgo-test-results/advisories/*.json
            .nextgo-test-results/advisories/*.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
  go:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-go-${{ matrix.go }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.24.x', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Check generated route helpers
        run: |
          go run ./cmd/nextgo generate --check ./examples/demo
          go run ./cmd/nextgo generate --check ./examples/comparison
          go run ./cmd/nextgo generate --check ./examples/widgets
          go run ./cmd/nextgo generate --check ./examples/workspace/site
          go run ./cmd/nextgo generate --check ./examples/content
          go run ./cmd/nextgo generate --check ./examples/metadata-site
          go run ./cmd/nextgo generate --check ./examples/root-layouts
          go run ./cmd/nextgo generate --check ./examples/social-variants
          go run ./cmd/nextgo generate --check ./examples/form-validation
          go run ./cmd/nextgo generate --check ./examples/refresh
          go run ./cmd/nextgo generate --check ./examples/zones/marketing
          go run ./cmd/nextgo generate --check ./examples/zones/blog
          go run ./cmd/nextgo generate --check ./examples/zones/tenant
          go run ./cmd/nextgo generate --check ./examples/independent-zones/apps/alpha
          go run ./cmd/nextgo generate --check ./examples/independent-zones/apps/blog
          go run ./cmd/nextgo generate --check ./examples/offline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: go test -race ./...
      - run: go vet ./...
      - name: Go WASM client unit tests
        env:
          GOMAXPROCS: '1'
        run: sh scripts/test-wasm.sh
      - name: Go WASM core and module vet
        run: |
          GOOS=js GOARCH=wasm go vet ./client ./mutation ./offline ./offline/worker ./internal/offlinejson ./internal/routing ./internal/navigation
          GOOS=js GOARCH=wasm go vet -tags=nextgo_module ./client
          GOOS=js GOARCH=wasm go vet -tags=nextgo_devrefresh ./client ./mutation
          GOOS=js GOARCH=wasm go vet -tags='nextgo_module nextgo_devrefresh' ./client
      - name: Compiled routing differential fuzz and measurements
        env:
          GOMAXPROCS: '1'
        run: |
          mkdir -p .nextgo-test-results/routing-index
          go version > .nextgo-test-results/routing-index/sdk.log
          go test ./internal/routing -run '^$' -fuzz '^FuzzCompiledIndexAgainstLinear$' -fuzztime=10s > .nextgo-test-results/routing-index/fuzz-match.log
          go test ./internal/routing -run '^$' -fuzz '^FuzzIndexedValidationAgainstLinear$' -fuzztime=10s > .nextgo-test-results/routing-index/fuzz-validation.log
          go test ./internal/routing -run '^$' -bench '^BenchmarkRoute' -benchtime=100ms -count=3 > .nextgo-test-results/routing-index/bench.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: routing-index-${{ matrix.go }}
          path: .nextgo-test-results/routing-index/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
      - run: go run ./cmd/nextgo build -out ./dist/demo ./examples/demo
      - name: Measure an independent production generation
        run: go run ./cmd/nextgo analyze -out ./dist/demo-analysis.json ./examples/demo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-analysis-${{ matrix.go }}
          path: dist/demo-analysis.json
          if-no-files-found: warn
          retention-days: 7
      - run: go run ./cmd/nextgo build -out ./dist/workspace ./examples/workspace/site
      - name: Additional example production and static builds
        run: |
          go run ./cmd/nextgo build -out ./dist/content ./examples/content
          go run ./cmd/nextgo build -out ./dist/metadata-site ./examples/metadata-site
          go run ./cmd/nextgo build -out ./dist/form-validation ./examples/form-validation
          go run ./cmd/nextgo build -out ./dist/refresh ./examples/refresh
          go run ./cmd/nextgo export -out ./dist/content-static ./examples/content
          NEXTGO_METADATA_BASE_PATH=/metadata-site go run ./cmd/nextgo export -out ./dist/metadata-static ./examples/metadata-site
          NEXTGO_REFRESH_BASE_PATH=/refresh NEXTGO_REFRESH_ASSET_PREFIX=/refresh-assets NEXTGO_REFRESH_PUBLIC_NOTE='Production fixture public note' go run ./cmd/nextgo export -out ./dist/refresh-static ./examples/refresh
      - run: go build -trimpath -o ./dist/nextgo-cache ./cmd/nextgo-cache
      - name: Multi-zone standalone production build
        run: |
          go build -trimpath -o ./dist/nextgo ./cmd/nextgo
          ./dist/nextgo zones build -out ./dist/zones ./examples/zones/zones.json
      - name: Native HTTP, Lambda and durable cache process conformance
        shell: bash
        run: |
          NEXTGO_TEST_BINARY="$PWD/dist/demo/server" \
          NEXTGO_TEST_WORKSPACE_BINARY="$PWD/dist/workspace/server" \
          NEXTGO_TEST_CACHE_BINARY="$PWD/dist/nextgo-cache" \
          go test -race -tags=deployment ./tests/deployment -count=1
      - name: Resources, social images and media through both Lambda modes
        run: NEXTGO_TEST_BINARY="$PWD/dist/demo/server" node --test tests/seven-feature-lambda.test.mjs
      - name: Form validation through native HTTP and both Lambda modes
        run: NEXTGO_FORM_VALIDATION_BINARY="$PWD/dist/form-validation/server" npm run test:form-validation:deployment
      - name: Refresh sample production and static transport contract
        timeout-minutes: 5
        run: NEXTGO_REFRESH_SERVER_BINARY="$PWD/dist/refresh/server" NEXTGO_REFRESH_STATIC_ROOT="$PWD/dist/refresh-static" npm run test:refresh-production
      - name: Multi-zone HTTP, Lambda, authority and publication conformance
        run: NEXTGO_ZONES_BINARY="$PWD/dist/zones/server" NEXTGO_ZONES_CLI="$PWD/dist/nextgo" npm run test:zones:deployment
      - name: Standalone production smoke test
        shell: bash
        run: |
          work=$(mktemp -d)
          cp ./dist/demo/server "$work/server"
          cd "$work"
          ./server -addr 127.0.0.1:4200 >server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4200/api/health; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error --max-time 15 --max-filesize 1048576 \
            --output smoke.html http://127.0.0.1:4200/
          grep -q '<html' smoke.html
          kill -TERM "$server_pid"
          wait "$server_pid"
  browser:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-browser
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install system dependencies with verified task-local APT bounds
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/install-ci-playwright-deps.test.mjs
          node scripts/install-ci-playwright-deps.mjs
      - name: Download repository-pinned Playwright browsers
        timeout-minutes: 30
        run: node node_modules/playwright-core/cli.js install chromium firefox webkit
      - run: npm test
      - run: npm run test:crossbrowser
      - run: npm run test:shared-cache
      - run: npm run test:shared-pages
      - run: npm run test:shared-prerender
      - run: npm run test:static:crossbrowser
      - name: Client resources and lazy-module invalidation
        run: npm run test:resources
      - name: Typed embeds and native media
        run: npm run test:embeds
      - name: Server-rendered social images
        run: npm run test:social-image
      - name: Production artifacts for focused browser fixtures
        run: |
          go run ./cmd/nextgo build -out ./dist/lambda-demo ./examples/demo
          go run ./cmd/nextgo build -out ./dist/metadata-site ./examples/metadata-site
          go run ./cmd/nextgo build -out ./dist/form-validation ./examples/form-validation
          NEXTGO_METADATA_BASE_PATH=/metadata-site go run ./cmd/nextgo export -out ./dist/metadata-static ./examples/metadata-site
          go build -trimpath -o ./dist/nextgo ./cmd/nextgo
          ./dist/nextgo zones build -out ./dist/zones ./examples/zones/zones.json
      - name: Browser hydration and navigation through both local Lambda modes
        run: NEXTGO_E2E_SERVER_BINARY="$PWD/dist/lambda-demo/server" npm run test:lambda:browser
      - name: Managed metadata through native and static deployments
        run: NEXTGO_METADATA_SERVER_BINARY="$PWD/dist/metadata-site/server" NEXTGO_METADATA_STATIC_ROOT="$PWD/dist/metadata-static" npm run test:metadata-files
      - name: Form validation, native choices and lifecycle
        run: NEXTGO_E2E_SERVER_BINARY="$PWD/dist/form-validation/server" npm run test:form-validation
      - name: Multi-zone rendering, navigation and tenant membership
