  refresh:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-refresh
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --init --shm-size 512m
    defaults:
      run:
        shell: bash
    env:
      GOTELEMETRY: 'off'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      GOTOOLCHAIN: local
      GOMAXPROCS: '1'
      GOFLAGS: -p=1
    steps:
      - name: Own refresh image home and compiler paths
        timeout-minutes: 2
        run: |
          set -euo pipefail
          command -v git
          browser_image_root=$(mktemp -d "$RUNNER_TEMP/nextgo-refresh-image-ci.XXXXXX")
          mkdir -m 700 "$browser_image_root/home" "$browser_image_root/go-cache" "$browser_image_root/mod-cache" "$browser_image_root/tmp"
          test "$(stat -c %u "$browser_image_root/home")" = "$(id -u)"
          {
            echo "NEXTGO_BROWSER_IMAGE_CI=$browser_image_root"
            echo "HOME=$browser_image_root/home"
            echo "GOCACHE=$browser_image_root/go-cache"
            echo "GOMODCACHE=$browser_image_root/mod-cache"
            echo "TMPDIR=$browser_image_root/tmp"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Trust only the checked-out refresh workspace
        timeout-minutes: 2
        run: |
          set -euo pipefail
          test "$(stat -c %u "$HOME")" = "$(id -u)"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --show-toplevel
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Preserve native cgo compiler with verified task-local APT bounds
        timeout-minutes: 15
        run: |
          set -euo pipefail
          node --test scripts/install-ci-playwright-deps.test.mjs scripts/install-ci-native-compiler.test.mjs
          node scripts/install-ci-native-compiler.mjs
          test "$(command -v gcc)" = /usr/bin/gcc
          test "$(command -v ld)" = /usr/bin/ld
          test "$(go env CC)" = gcc
          test "$(go env CGO_ENABLED)" = 1
          gcc -dumpfullversion -dumpversion
          ld --version
          go env -json GOOS GOARCH CGO_ENABLED CC GOROOT GOCACHE GOMODCACHE
      - name: Validate preinstalled browser metadata and actual launch versions
        timeout-minutes: 15
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { constants } from 'node:fs';
          import { access, readFile, realpath, stat } from 'node:fs/promises';
          import { isAbsolute, relative } from 'node:path';
          import { chromium, firefox, webkit } from '@playwright/test';
          const core = JSON.parse(await readFile('node_modules/playwright-core/package.json', 'utf8'));
          const declared = JSON.parse(await readFile('package.json', 'utf8')).devDependencies['@playwright/test'];
          const descriptors = JSON.parse(await readFile('node_modules/playwright-core/browsers.json', 'utf8')).browsers;
          assert.equal(core.version, '1.64.1');
          assert.equal(declared, core.version);
          assert.equal(process.platform, 'linux');
          assert.ok(['x64', 'arm64'].includes(process.arch));
          assert.equal(process.versions.node.split('.')[0], '22');
          assert.ok(Array.isArray(descriptors) && descriptors.length <= 32);
          const home = await realpath(process.env.HOME);
          const owned = await realpath(process.env.NEXTGO_BROWSER_IMAGE_CI);
          assert.equal(relative(owned, home), 'home');
          assert.equal((await stat(home)).uid, process.getuid());
          assert.equal((await stat(home)).mode & 0o777, 0o700);
          const browsers = await realpath('/ms-playwright');
          const executables = {}, versions = {};
          for (const [name, browser] of Object.entries({ chromium, firefox, webkit })) {
            const executable = await realpath(browser.executablePath());
            const rel = relative(browsers, executable);
            assert.ok(rel && !isAbsolute(rel) && rel !== '..' && !rel.startsWith('../'));
            assert.ok((await stat(executable)).isFile());
            await access(executable, constants.X_OK);
            executables[name] = executable;
            const expected = descriptors.filter(item => item.name === name);
            assert.equal(expected.length, 1);
            assert.match(expected[0].browserVersion, /^[0-9]+(?:\.[0-9]+){1,3}$/);
            const running = await browser.launch({headless: true, timeout: 30_000});
            try {versions[name] = running.version(); assert.equal(versions[name], expected[0].browserVersion);}
            finally {await running.close();}
          }
          console.log(JSON.stringify({phase: 'preinstalled-browser-runtime', playwright: core.version,
            node: process.version, platform: process.platform, arch: process.arch, uid: process.getuid(),
            ownedHome: home, executables, versions, browserCloseAcknowledgements: 3,
            scope: 'Browser API close acknowledgement, not process-group or resource-gate proof'}));
          NODE
      - name: Build refresh qualification artifacts
        run: |
          go build -trimpath -o ./dist/nextgo ./cmd/nextgo
          ./dist/nextgo build -out ./dist/refresh ./examples/refresh
          NEXTGO_REFRESH_BASE_PATH=/refresh NEXTGO_REFRESH_ASSET_PREFIX=/refresh-assets NEXTGO_REFRESH_PUBLIC_NOTE='Production fixture public note' ./dist/nextgo export -out ./dist/refresh-static ./examples/refresh
      - name: Refresh production transport contract
        run: NEXTGO_REFRESH_SERVER_BINARY="$PWD/dist/refresh/server" NEXTGO_REFRESH_STATIC_ROOT="$PWD/dist/refresh-static" npm run test:refresh-production
      - name: Opt-in lazy Go state refresh development contract
        timeout-minutes: 60
        run: |
          mkdir -p .nextgo-test-results/refresh-qualification
          PLAYWRIGHT_JSON_OUTPUT_FILE="$PWD/.nextgo-test-results/refresh-qualification/dev.json" NEXTGO_E2E_NEXTGO_BINARY="$PWD/dist/nextgo" npm run test:refresh-dev -- --reporter=list,json
      - name: Refresh sample production and static browsers
        timeout-minutes: 30
        shell: bash
        env:
          NEXTGO_REFRESH_SERVER_BINARY: ${{ github.workspace }}/dist/refresh/server
          NEXTGO_REFRESH_STATIC_ROOT: ${{ github.workspace }}/dist/refresh-static
        run: |
          mkdir -p .nextgo-test-results/refresh-qualification
          for transport in http buffered streaming static; do
            PLAYWRIGHT_JSON_OUTPUT_FILE="$PWD/.nextgo-test-results/refresh-qualification/production-$transport.json" NEXTGO_REFRESH_TRANSPORT="$transport" npm run test:refresh-production:browser -- --reporter=list,json
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refresh-qualification-json
          path: .nextgo-test-results/refresh-qualification/*.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
