      - name: Own LinkStatus artifacts and evidence outside checkout
        shell: bash
        run: |
          set -eu
          link_root=$(mktemp -d "$RUNNER_TEMP/nextgo-link-status-ci.XXXXXX")
          export NEXTGO_LINK_STATUS_CI="$link_root"
