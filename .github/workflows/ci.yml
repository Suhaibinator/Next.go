          cat > ./dist/root-layouts/Dockerfile <<'DOCKER'
          FROM scratch
          COPY --chmod=0555 server /server
          COPY --chmod=0555 deployment.test /deployment.test
          USER 65532:65532
          ENV NEXTGO_TEST_ROOTS_BINARY=/server NEXTGO_TEST_UID=65532 GOMAXPROCS=2
          ENTRYPOINT ["/deployment.test"]
          CMD ["-test.run=^TestRootLayoutsExecutable$", "-test.v", "-test.timeout=45s"]
          DOCKER
          docker build --network=none -t nextgo-root-layouts-local ./dist/root-layouts
          docker run --rm --read-only --network=none --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=128 --memory=256m nextgo-root-layouts-local
      - name: Private route native and isolated container contract
        shell: bash
        run: |
          go test -c -tags=deployment -o ./dist/client-only/deployment.test ./tests/deployment
          NEXTGO_TEST_BINARY="$NEXTGO_PRIVATE_BINARY" ./dist/client-only/deployment.test '-test.run=^TestPrivateRoutesExecutable$' -test.v -test.timeout=45s
          cat > ./dist/client-only/Dockerfile <<'DOCKER'
          FROM scratch
          COPY --chmod=0555 server /server
          COPY --chmod=0555 deployment.test /deployment.test
