name: Static shell functional CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: static-shell-${{ github.ref }}
  cancel-in-progress: false
jobs:
  static-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        go: ['1.24.13', '1.27.3']
    env:
      GO_VERSION: ${{ matrix.go }}
      GOTOOLCHAIN: local
      GOMAXPROCS: '1'
      GOFLAGS: -p=1 -buildvcs=false
      GOMEMLIMIT: 384MiB
      GOTELEMETRY: 'off'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Own fresh temporary caches, exports and evidence
        timeout-minutes: 2
        run: node tests/static-shell-ci-build.mjs init
      - name: Install exact locked test dependencies
        timeout-minutes: 5
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install pinned Playwright browsers and system dependencies
        # A related actual install took 47m22s; this is an explicit finite lease.
        timeout-minutes: 60
        run: node tests/static-shell-ci-build.mjs install
      - name: Build one real CLI, preserve generated helpers and export four variants
        timeout-minutes: 35
        run: node tests/static-shell-ci-build.mjs build
      - name: Discover exactly48 and require48 actual passing static browser cases
        timeout-minutes: 20
        run: node tests/static-shell-ci-browser.mjs
      - name: Collect bounded proof and first-failure browser evidence
        if: always() && env.NEXTGO_STATIC_SHELL_CI != ''
        timeout-minutes: 2
        run: node tests/static-shell-ci-build.mjs collect
      - uses: actions/upload-artifact@v4
        if: always() && env.NEXTGO_STATIC_SHELL_CI != ''
        with:
          name: static-shell-functional-evidence-go${{ matrix.go }}
          path: ${{ env.NEXTGO_STATIC_SHELL_CI }}/failure/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
      - name: Remove only the marker-verified owned temporary root
        if: always() && env.NEXTGO_STATIC_SHELL_CI != ''
        timeout-minutes: 3
        run: node tests/static-shell-ci-build.mjs cleanup
